<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta
      name="description"
      content="Xee.Labs — an open-source trading terminal with advanced charting, drawing tools, watchlist, DOM and a built-in paper-trading engine."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xee.Labs" />
    <meta property="og:title" content="Xee.Labs" />
    <meta
      property="og:description"
      content="Open-source trading terminal — advanced charts, drawing tools, and paper trading."
    />
    <meta property="og:type" content="website" />
    <title>Xee.Labs — Open-Source Trading Terminal</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("theme_mode");
          var accent = localStorage.getItem("theme_accent");
          document.documentElement.classList.toggle("light", mode === "light");
          if (accent && accent !== "teal") document.documentElement.dataset.accent = accent;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
