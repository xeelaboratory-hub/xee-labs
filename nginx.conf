server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — apply to every response (static assets and the
    # proxied /api, /ws responses too, since neither location block below
    # sets its own add_header, which would otherwise stop these from
    # inheriting — see http://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header).
    #
    # CSP is scoped to what this build actually loads, verified against a
    # real `npm run build` output and the live source:
    #   - script-src: 'self' (all our JS is same-origin build output, no
    #     inline <script> in the built index.html) plus TradingView's embed
    #     script host — BottomPanel.tsx renders TradingViewWidgets.tsx
    #     unconditionally in production, so this one is genuinely required.
    #   - style-src needs 'unsafe-inline': some vendor UI code
    #     (Radix/cmdk-style libraries) injects <style> tags at runtime with
    #     no nonce available from this static file server — confirmed by
    #     grepping the production bundle for dynamic style-tag creation.
    #     React's own inline `style={}` props set element.style directly and
    #     are unaffected by CSP either way.
    #   - connect-src/frame-src: 'self' covers the same-origin /api and /ws
    #     (CSP's 'self' matches the ws(s) equivalent of the page's own
    #     origin), plus TradingView's iframe host for the same widgets.
    #   - PostHog (src/lib/posthog.ts) is intentionally NOT allow-listed:
    #     the Dockerfile never passes VITE_POSTHOG_API_KEY as a build arg,
    #     so `posthog.init()` never runs in this build and the SDK stays
    #     dormant — opening a CSP hole for a host it can't reach would be
    #     pure attack surface. If a build ever does set that key, connect-src
    #     needs `https://us.i.posthog.com` (or the configured VITE_POSTHOG_HOST)
    #     added here.
    #   - No remote fonts/images are used (all icons are same-origin, no
    #     @font-face) — font-src/img-src stay 'self' (+ data: for any
    #     library-generated data URIs).
    #   - No HSTS: this file only ever `listen`s on plain :80 — there is no
    #     TLS termination in this repo to make an HSTS promise honest. Add
    #     `Strict-Transport-Security` at whatever layer actually terminates
    #     TLS in front of this (see docs/operations/backup-restore.md-style
    #     runbook note in AGENTS.md) — don't turn it on here blindly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Legacy fallback for browsers that don't honor CSP frame-ancestors.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://s3.tradingview.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src https://*.tradingview.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # REST API — same-origin proxy to the backend service (docker-compose's
    # internal DNS resolves "backend" to that container). Keeps the browser
    # talking to a single origin, mirroring vite.config.ts's dev proxy so no
    # frontend code (API_BASE, request.ts) has to know about docker at all.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Market-data WebSocket — same proxy target, with the Upgrade/Connection
    # headers nginx needs to hand the connection off instead of buffering it,
    # and a long read timeout since ticks can be the only keepalive traffic.
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
