server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST API — same-origin proxy to the backend service (docker-compose's
    # internal DNS resolves "backend" to that container). Keeps the browser
    # talking to a single origin, mirroring vite.config.ts's dev proxy so no
    # frontend code (API_BASE, request.ts) has to know about docker at all.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Market-data WebSocket — same proxy target, with the Upgrade/Connection
    # headers nginx needs to hand the connection off instead of buffering it,
    # and a long read timeout since ticks can be the only keepalive traffic.
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
