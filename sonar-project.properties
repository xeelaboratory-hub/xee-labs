sonar.projectKey=opencharts
sonar.projectName=OpenCharts

# Ties the New Code Period (PREVIOUS_VERSION) to the project's actual release version
# instead of leaving it unset. Keep in sync with package.json.
sonar.projectVersion=1.6.0

# Real product source: frontend (src), backend (Python), scraper (Python)
sonar.sources=src,backend/app,scraper/app,scripts,index.html
sonar.tests=src/__tests__,backend/tests,scraper/tests
sonar.python.version=3

# Coverage reports produced by the existing test runners (vitest, pytest-cov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml,scraper/coverage.xml

# Exclude build output, dependencies, caches, and generated/vendor files
# (test directories are excluded from sonar.sources here since they are indexed separately via sonar.tests)
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**,**/*.egg-info/**,**/.pytest_cache/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/.turbo/**,public/**,src/vendor/**,backend/alembic/versions/**,src/__tests__/**,backend/tests/**,scraper/tests/**

sonar.sourceEncoding=UTF-8
