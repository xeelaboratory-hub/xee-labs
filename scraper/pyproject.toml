[project]
name = "xee-labs-etf-scraper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "asyncpg>=0.29",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
